# Nginx = cửa vào duy nhất (2026-08-20).
#
# Ranh giới sau khi tách frontend/backend:
#     trình duyệt --HTTPS:8443--> nginx ┬─ / ........... file tĩnh api/frontend/
#                                       └─ /api/* ...... proxy sang gateway:8100 (HTTP nội bộ)
#                                          /health
#                                          /__devreload
#
# Vì sao vẫn phải qua gateway chứ nginx không gọi thẳng qa/feedback/admin:
# gateway giữ phần LOGIC không thuộc về nginx - xác minh cookie phiên ký
# HMAC, chặn theo vai trò (user không gọi được /api/admin/*), và gắn
# X-Admin-Key server-side. Đó là logic ứng dụng, nginx không làm được.
# nginx chỉ lo TLS + file tĩnh, đúng việc của nó.

upstream gateway_upstream {
    # "gateway" = tên service trong docker-compose.yml, Docker tự phân giải
    # DNS trong mạng nội bộ. Không dùng 127.0.0.1 - trong container đó là
    # chính nginx.
    server gateway:8100;
}

# HTTP :80 -> chuyển hết sang HTTPS. Giữ lại để ai gõ nhầm http://localhost:8443
# hay http://localhost không bị "connection refused" khó hiểu.
server {
    listen 80;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Chứng chỉ dev tự ký, sinh bằng api/certs/generate_dev_certs.sh và
    # bind-mount vào container (xem docker-compose.yml). KHÔNG nướng vào
    # image - .dockerignore đã loại *.pem vì layer image đọc lại được.
    ssl_certificate     /etc/nginx/certs/dev-cert.pem;
    ssl_certificate_key /etc/nginx/certs/dev-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Body lớn: câu hỏi dài + payload feedback. Mặc định 1MB của nginx đủ
    # cho hiện tại, nới lên 16MB để sau này upload PDF qua UI không phải
    # quay lại sửa chỗ này mới phát hiện.
    client_max_body_size 16m;

    # --- API: proxy sang gateway ---------------------------------------
    location /api/ {
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # QUAN TRỌNG: gateway đặt cookie phiên với secure=True. Nếu không
        # báo cho backend biết request gốc là HTTPS, một số framework sẽ
        # tự hạ cấp/ từ chối cookie. Ở đây FastAPI không tự làm vậy nhưng
        # khai đúng để không phụ thuộc vào chi tiết cài đặt.
        proxy_set_header X-Forwarded-Proto https;

        # SSE (/api/qa/ask/stream): PHẢI tắt đệm, nếu không nginx gom hết
        # sự kiện rồi mới trả một lượt - người dùng ngồi nhìn spinner câm,
        # đúng thứ mà _proxy_sse() trong gateway đã cẩn thận tránh.
        # Gateway cũng đã gửi X-Accel-Buffering: no (nginx tôn trọng
        # header đó), nhưng khai tường minh ở đây để không phụ thuộc vào
        # việc header kia còn tồn tại.
        proxy_buffering off;
        proxy_cache off;
        # Câu trả lời LLM chạy CPU có thể lâu (xem ghi chú GPU trong
        # docs/DOCKER.md). 180s khớp request_timeout_s của gateway - để
        # nginx timeout NGẮN hơn backend thì lỗi hiện ra là 504 của nginx,
        # che mất lỗi thật.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # /health và /__devreload nằm ở gốc (không có tiền tố /api) nên phải
    # khai riêng, nếu không chúng rơi vào location / và nginx đi tìm file
    # tên "health" trong thư mục tĩnh rồi trả 404.
    location = /health {
        proxy_pass http://gateway_upstream;
        proxy_set_header Host $host;
    }

    location = /__devreload {
        proxy_pass http://gateway_upstream;
        proxy_set_header Host $host;
        access_log off;   # poll mỗi giây, sẽ ngập log nếu ghi
    }

    # --- Frontend tĩnh -------------------------------------------------
    location / {
        root /usr/share/nginx/html;

        # SPA: mọi đường dẫn không khớp file thật đều rơi về index.html để
        # client-side routing hoạt động (giống app.frontend() của FastAPI
        # trước đây).
        try_files $uri $uri/ /index.html;

        # KHÔNG cache trong lúc phát triển. Thư mục này là bind mount tới
        # api/frontend/ trên máy thật, nên sửa file rồi F5 là thấy ngay -
        # nếu để nginx cache thì mất đúng tính chất "cập nhật code là
        # Docker cập nhật theo" mà cả thiết lập này hướng tới.
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
}
