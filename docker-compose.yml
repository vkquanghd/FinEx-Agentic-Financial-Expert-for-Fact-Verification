# Neo cấu hình dùng chung cho 4 service API (gateway/qa/feedback/admin).
#
# PHẢI nằm ở CẤP CAO NHẤT, không phải trong `services:` - mọi khoá trong
# `services:` đều được hiểu là TÊN MỘT SERVICE, nên đặt anchor ở trong đó
# sẽ khiến Compose cố dựng một service rỗng tên "x-api-common". Khoá `x-*`
# ở cấp cao nhất thì Compose bỏ qua, đúng chỗ để định nghĩa anchor.
#
# Lợi ích: sửa MỘT chỗ, cả 4 service nhận. Tránh copy-paste 4 lần rồi lệch
# nhau lúc sửa - lỗi kinh điển của compose file dài.
x-api-common: &api-common
  build:
    context: .
    dockerfile: infra/docker/api.Dockerfile
    args:
      WITH_RAG: ${WITH_RAG:-1}
  image: thesis-api:latest
  restart: unless-stopped
  # CỐ Ý không có `depends_on: ollama`.
  #
  # Hai lý do:
  #   1. API không cần Ollama lúc KHỞI ĐỘNG - 4/5 nhánh câu hỏi
  #      (DAG/whatif/causal/compare) không gọi LLM chút nào. Chỉ nhánh RAG
  #      mới cần, và lúc đó gọi qua HTTP nên Ollama lên muộn vẫn được.
  #   2. Quan trọng hơn: có depends_on thì KHÔNG tắt được container ollama
  #      để chuyển sang Ollama.app native trên máy - Compose sẽ luôn kéo
  #      nó dậy. Bỏ đi thì `docker compose up -d --scale ollama=0` chạy
  #      đúng như mong đợi (xem docs/DOCKER.md §"Ollama và GPU").
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: ${DB_NAME}
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    # CỐ Ý dùng tên biến RIÊNG (OLLAMA_HOST_DOCKER), không phải
    # ${OLLAMA_HOST:-...}.
    #
    # Lý do: .env ở gốc repo đã có sẵn `OLLAMA_HOST=http://localhost:11434`
    # - đúng cho việc chạy script THẲNG trên máy. Compose cũng đọc chính
    # file .env đó để nội suy ${...}, nên `${OLLAMA_HOST:-http://ollama:11434}`
    # sẽ KHÔNG bao giờ rơi vào giá trị mặc định: nó lấy "localhost", mà
    # trong container localhost là chính container đó -> mọi lời gọi LLM
    # lỗi "connection refused", trong khi Ollama vẫn chạy ngon lành ở
    # container bên cạnh. Tên biến riêng cắt hẳn sự nhầm lẫn này.
    #
    # Muốn dùng Ollama.app NATIVE trên máy (nhanh hơn nhiều trên Mac - xem
    # docs/DOCKER.md §"Ollama và GPU"), đặt trong .env:
    #     OLLAMA_HOST_DOCKER=http://host.docker.internal:11434
    OLLAMA_HOST: ${OLLAMA_HOST_DOCKER:-http://ollama:11434}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
    # Cổng nội bộ: dùng TÊN SERVICE của compose, không phải 127.0.0.1
    # (trong container, 127.0.0.1 là chính container đó).
    QA_SERVICE_URL: http://qa:8101
    FEEDBACK_SERVICE_URL: http://feedback:8102
    ADMIN_SERVICE_URL: http://admin:8103
    #
    # ADMIN_API_KEY và SESSION_SECRET CỐ Ý KHÔNG khai ở đây.
    #
    # Chúng nằm trong api/.env, và api/.env đã có mặt trong container nhờ
    # bind mount `./api:/app/api:ro` bên dưới - đúng đường dẫn mà
    # api/shared/config.py trỏ tới (`env_file = API_DIR / ".env"`).
    #
    # Nếu viết `ADMIN_API_KEY: ${ADMIN_API_KEY}` thì hỏng ÂM THẦM: hai
    # biến này không có trong .env ở GỐC repo (nơi Compose đọc để nội suy
    # ${...}), nên Compose đặt chúng thành CHUỖI RỖNG. Mà thứ tự ưu tiên
    # của pydantic-settings là biến môi trường > env_file, nên chuỗi rỗng
    # đó ghi đè giá trị thật trong api/.env -> /api/auth/login trả 503
    # "thiếu SESSION_SECRET" dù file cấu hình hoàn toàn đúng. Không khai
    # gì cả thì env_file được dùng, đúng như khi chạy ngoài Docker.
    #
    # nginx mới là thứ trình duyệt nhìn thấy -> origin hợp lệ là cổng 8443
    # của nginx, không phải cổng nội bộ của gateway.
    ALLOWED_ORIGINS: '["https://localhost:8443","https://127.0.0.1:8443"]'
    # Backend là REST thuần: nginx giữ frontend.
    SERVE_FRONTEND: "0"
    HF_HOME: /opt/hf-cache
  volumes:
    # Bind-mount code = trái tim của "cập nhật code thì Docker tự cập
    # nhật". :ro vì service không bao giờ cần ghi vào code của chính nó.
    - ./src:/app/src:ro
    - ./api:/app/api:ro
    - ./scripts:/app/scripts:ro
    # data/ KHÔNG :ro - nhánh RAG/ETL có ghi file trung gian.
    - ./data:/app/data
    # .env ở gốc: src/core/config.py đọc file này cho phần DB/Ollama.
    - ./.env:/app/.env:ro
    - api_hf_cache:/opt/hf-cache

services:
  # Single PostgreSQL + pgvector database (migrated 2026-07-26 off the old
  # two-service setup - MySQL for structured tables + a separate
  # "vectorstore" pgvector service - onto ONE database. See
  # docs/PROGRESS.md "Gộp MySQL + pgvector thành một PostgreSQL duy nhất"
  # and infra/postgres/migrations/001_init_schema.sql for the consolidated
  # schema, which now holds companies/financial_line_items/.../disclosures/
  # ingestion_log/macro_indicators/company_price_snapshot AND
  # disclosure_chunks (the vector table) together. Auto-applied on first
  # startup, same as the old MySQL init flow - schema is NOT applied by hand
  # anymore (the old pgvector service required a manual `docker exec ...
  # psql < 001_disclosure_chunks.sql` step; this one doesn't).
  postgres:
    image: pgvector/pgvector:pg16
    container_name: thesis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    build:
      context: .
      dockerfile: infra/airflow/Dockerfile
    container_name: thesis_airflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Airflow's own metadata DB (separate from financial_db) - SQLite is
      # fine here since this pipeline's tasks run one at a time anyway
      # (they're chained by dependency, not run in parallel at scale).
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # Overrides src/core/config.py's DB_HOST/DB_PORT defaults so scripts
      # running INSIDE this container reach Postgres via the docker network
      # (service name "postgres", internal port 5432) instead of
      # localhost:5432. Also covers what used to be the separate PGVECTOR_*
      # vars - src/core/config.py now aliases those straight to DB_* since
      # it's the same database, so only DB_HOST/DB_PORT/DB_NAME/DB_USER/
      # DB_PASSWORD need setting here (no more PGVECTOR_HOST/PORT/DB/USER/
      # PASSWORD block).
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # BAAI/bge-m3 weights (~2.2GB) get cached here on first embedding run
      # inside the container. Explicitly a named Docker volume, NOT a path
      # under the bind-mounted project directory - the project lives under
      # ~/Desktop, which iCloud syncs, and syncing a 2.2GB binary blob to
      # iCloud on every container rebuild is exactly the kind of slowdown
      # already hit once with the PDF corpus (see docs/PROGRESS.md). This
      # keeps the cache in Docker's own storage instead.
      HF_HOME: /home/airflow/.cache/huggingface
      # thesis_market_snapshot DAG (scripts/market_snapshot.py) - oil-price
      # ingestion via FRED is skipped automatically if this is blank.
      FRED_API_KEY: ${FRED_API_KEY:-}
    volumes:
      - .:/opt/airflow/project
      - ./infra/airflow/dags:/opt/airflow/dags
      - airflow_home:/opt/airflow
      - airflow_hf_cache:/home/airflow/.cache/huggingface
    ports:
      - "8080:8080"
    command: standalone

  # ===================================================================
  # TẦNG PHỤC VỤ (thêm 2026-08-20)
  #
  # Trước đây 4 service API chạy bằng `bash api/dev.sh` trên venv của
  # máy thật, cố ý KHÔNG Docker - lý do ghi trong api/dev.sh: "build lại
  # image mỗi lần sửa code sẽ chậm hơn --reload". Lý do đó chỉ đúng khi
  # code NẰM TRONG image. Ở đây code được bind-mount (`./src`, `./api`)
  # và uvicorn chạy --reload, nên:
  #     sửa file .py   -> container tự nạp lại ~1 giây, KHÔNG build
  #     thêm thư viện  -> lúc đó mới `docker compose build`
  #
  # Ranh giới frontend/backend (chốt 2026-08-20): nginx là container
  # riêng lo TLS + file tĩnh; 4 service FastAPI là REST thuần, không
  # phục vụ HTML (SERVE_FRONTEND=0).
  # ===================================================================

  # LLM cục bộ. Mặc định BẬT - `docker compose up -d` là có luôn, tự tải
  # model, đúng yêu cầu "tự động hết trên docker".
  #
  # ĐỌC docs/DOCKER.md §"Ollama và GPU" TRƯỚC khi dùng cho việc nặng:
  # Docker Desktop trên macOS không truy cập được GPU Apple Silicon (giới
  # hạn Hypervisor.framework), nên container này chạy CPU-only, chậm
  # khoảng 3-5 lần so với Ollama.app cài thẳng trên máy.
  #
  # Chuyển sang bản native (giữ nguyên mọi container khác):
  #     # trong .env:  OLLAMA_HOST_DOCKER=http://host.docker.internal:11434
  #     docker compose up -d --scale ollama=0
  # Làm được vì không service nào `depends_on` nó - xem ghi chú ở anchor.
  ollama:
    image: ollama/ollama:latest
    container_name: thesis_ollama
    restart: unless-stopped
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
    entrypoint: ["/bin/sh", "/pull.sh"]
    volumes:
      - ollama_models:/root/.ollama
      - ./infra/docker/ollama-pull.sh:/pull.sh:ro
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      # Model ~5GB tải lần đầu -> start_period dài, nếu không Docker đánh
      # dấu unhealthy giữa chừng và các service phụ thuộc không khởi động.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s

  qa:
    <<: *api-common
    container_name: thesis_qa
    command: >
      uvicorn api.services.qa.main:app
      --host 0.0.0.0 --port 8101
      --reload --reload-dir api/services --reload-dir api/shared --reload-dir src
    expose:
      - "8101"

  feedback:
    <<: *api-common
    container_name: thesis_feedback
    command: >
      uvicorn api.services.feedback.main:app
      --host 0.0.0.0 --port 8102
      --reload --reload-dir api/services --reload-dir api/shared --reload-dir src
    expose:
      - "8102"

  admin:
    <<: *api-common
    container_name: thesis_admin
    command: >
      uvicorn api.services.admin.main:app
      --host 0.0.0.0 --port 8103
      --reload --reload-dir api/services --reload-dir api/shared --reload-dir src
    expose:
      - "8103"

  # Gateway chạy HTTP THƯỜNG ở đây (không TLS) - nginx đã chấm dứt TLS ở
  # biên. Chạy TLS hai lần trong cùng một mạng nội bộ chỉ thêm phức tạp,
  # không thêm bảo mật thật.
  #
  # KHÔNG map cổng ra ngoài: chỉ nginx chạm được. Đúng nguyên tắc "một
  # cửa vào duy nhất" đã ghi trong docstring của gateway.
  gateway:
    <<: *api-common
    container_name: thesis_gateway
    command: >
      uvicorn api.services.gateway.main:app
      --host 0.0.0.0 --port 8100
      --reload --reload-dir api/services --reload-dir api/shared --reload-dir src
    # depends_on ở đây GHI ĐÈ (không gộp) phần depends_on của anchor -
    # quy tắc của merge key YAML `<<`. Vì vậy phải khai lại postgres;
    # ollama thì gateway không cần (nó chỉ proxy, không gọi LLM).
    depends_on:
      postgres:
        condition: service_healthy
      qa:
        condition: service_started
      feedback:
        condition: service_started
      admin:
        condition: service_started
    expose:
      - "8100"

  # Frontend: nginx phục vụ api/frontend/ (bind-mount, KHÔNG có bước
  # build - đây là HTML/CSS/JS thuần + Alpine.js qua CDN). Nghĩa là sửa
  # index.html/app.js/styles.css rồi F5 là thấy ngay, không build, không
  # restart container.
  frontend:
    image: nginx:1.27-alpine
    container_name: thesis_frontend
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "${WEB_PORT:-8443}:443"
      - "${WEB_PORT_HTTP:-8480}:80"
    volumes:
      - ./api/frontend:/usr/share/nginx/html:ro
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Chứng chỉ dev tự ký. Chưa có thì chạy trước:
      #     bash api/certs/generate_dev_certs.sh
      - ./api/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
  airflow_home:
  airflow_hf_cache:
  ollama_models:
  api_hf_cache:
